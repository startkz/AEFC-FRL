name: IEEE39 R2024a Migration Audit

on:
  workflow_dispatch:
  push:
    branches:
      - revision/ieee39-r2024a-fullstack
    paths:
      - 'matlab/ieee39_migrate_r2024a.m'
      - 'matlab/ieee39_bridge_audit.m'
      - '.github/workflows/ieee39-r2024a-migration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'matlab/ieee39_migrate_r2024a.m'
      - 'matlab/ieee39_bridge_audit.m'
      - '.github/workflows/ieee39-r2024a-migration.yml'

permissions:
  contents: read

jobs:
  migrate-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4

      - name: Fetch the exact public IEEE39 source archive
        shell: bash
        run: |
          mkdir -p Figures
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/DESL-EPFL/IEEE-39-bus-power-system/master/model.zip \
            -o Figures/IEEE-39-bus-power.zip
          test "$(git hash-object Figures/IEEE-39-bus-power.zip)" = "41db586d592851c4a81205a4cc5c7c770b7a0c48"
          ls -lh Figures/IEEE-39-bus-power.zip

      - name: Set up MATLAB R2024a and Simulink electrical stack
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: >
            Simulink
            Simscape
            Simscape_Electrical
          cache: true

      - name: Migrate model and perform real short simulation
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab'); ieee39_migrate_r2024a

      - name: Audit real control and observation bridge
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab'); ieee39_bridge_audit

      - name: Upload migrated model and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ieee39-r2024a-migration-audit
          path: build/ieee39_r2024a
          if-no-files-found: warn
          retention-days: 14
